[runtime]
default_character = "nigel"
default_actor = "nigel-dev"

[llm]
provider = "ollama"
endpoint = "http://127.0.0.1:11434/api"
model = "llama3.2:3b"
api_key_env = "NUMAN_LLM_API_KEY"

[stt]
provider = "whisper-cpp"
model = "models/ggml-base.en.bin"
command = "whisper-cli"
endpoint = "https://api.deepgram.com/v1/listen?model=nova-3&smart_format=true"
api_key_env = "DEEPGRAM_API_KEY"
language = "en"
prompt = "Nigel, Polly, Mai Tai, Zombie, Painkiller, Jungle Bird, Navy Grog, Planter's Punch, orgeat, falernum, curaçao, demerara rum, tiki cocktails."

[microphone]
device = "system-default"
sample_rate = 16000
channels = 1

# Hardware-safe semantic show control. NUMAN names the effect; Light-O-Rama
# will eventually own the sequence, channels, relays, and choreography.
[show_control]
provider = "fake"
allowed_actions = ["storm", "lightning", "volcano_rumble", "blackout", "present_jet_pilot", "present_suffering_bastard"]

[wake]
enabled = true
model_dir = "models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
threshold = 0.20
score = 1.0

[wake.targets.nigel]
phrases = ["hey nigel"]
character = "nigel"
actor = "nigel-dev"

[wake.targets.polly]
phrases = ["hey polly"]
character = "polly"
actor = "polly-dev"

[characters.nigel]
name = "Nigel"
system_prompt = "You are Nigel, a snarky, grizzled old British pirate parrot who tends a tiki bar. Your exterior is gruff and your insults are sharp, barbed, and often pun-laden, but underneath you are loyal and soft-hearted. Never become cruel. Answer in one or two short sentences. Never write stage directions, role labels, sound effects, or asterisks; output only words Nigel should speak aloud. Never invent cocktail ingredients or recipes. If a drink name is unclear or you do not know its established recipe, ask the guest to repeat the name or admit that you do not know."
voice_profile = "nigel-edge-ryan-shrill"
show_actions = ["storm", "lightning", "volcano_rumble", "blackout", "present_jet_pilot", "present_suffering_bastard"]

[characters.polly]
name = "Polly"
system_prompt = "You are Polly, a brightly enthusiastic tiki-bar parrot whose relentless cheerfulness is almost sickening. Your taunts are sweet, dainty, and deceptively pointed: like being scratched by a feather. You are warm rather than cruel and never lose your sunny delivery. Answer in one or two short sentences. Never write stage directions, role labels, sound effects, or asterisks; output only words Polly should speak aloud. Never invent cocktail ingredients or recipes. If a drink name is unclear or you do not know its established recipe, ask the guest to repeat the name or admit that you do not know."
voice_profile = "polly-edge-jenny-bright"
show_actions = ["storm", "lightning", "present_jet_pilot", "present_suffering_bastard"]

[voices.nigel-edge-ryan-shrill]
provider = "edge-tts"
voice = "en-GB-RyanNeural"
sample_rate = 24000
channels = 1

# Nigel's tiki voice console. These values reproduce his current sound.
[voices.nigel-edge-ryan-shrill.tiki_console]
# Raise/lower the voice in semitones without changing speaking speed. Range: -12..12.
perch_pitch_semitones = 4
# The main nasal beak tone. Hz chooses its location; dB controls its strength.
beak_bite_hz = 3150
beak_bite_db = 20
# Focus of the beak tone. Lower is broader; higher is narrower and honkier.
beak_bite_width = 0.5
# High-frequency feather sheen. More dB is brighter and more piercing.
feather_sparkle_hz = 6000
feather_sparkle_db = 12
# Lo-fi Squawker texture. Lower bits are crunchier; 16 is nearly clean. Range: 2..16.
coconut_radio_bits = 6
# Final loudness target. Closer to zero is louder. Sensible range: -30..-5 LUFS.
rum_barrel_lufs = -14

[voices.polly-edge-jenny-bright]
provider = "edge-tts"
voice = "en-US-JennyNeural"
sample_rate = 24000
channels = 1

# Polly keeps a slightly lower perch, gentler beak bite, and cleaner radio.
[voices.polly-edge-jenny-bright.tiki_console]
perch_pitch_semitones = 3
beak_bite_hz = 3500
beak_bite_db = 14
beak_bite_width = 0.7
feather_sparkle_hz = 7000
feather_sparkle_db = 8
coconut_radio_bits = 8
rum_barrel_lufs = -14

[audio_routes.development-default]
backend = "system-default"
device = "system-default"

[audio_routes.polly-development]
backend = "system-default"
device = "system-default"

[actors.nigel-dev]
type = "squawker"
character = "nigel"
audio_route = "development-default"

[actors.polly-dev]
type = "squawker"
character = "polly"
audio_route = "polly-development"
