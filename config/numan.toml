[runtime]
default_character = "grog"
default_actor = "grog-dev"

[llm]
provider = "ollama"
endpoint = "http://127.0.0.1:11434/api"
model = "llama3.2:3b"
api_key_env = "NUMAN_LLM_API_KEY"
warm_on_start = true
keep_alive = "8h"

[stt]
provider = "whisper-server"
model = "models/ggml-base.en.bin"
command = "whisper-server"
host = "127.0.0.1"
port = 8178
use_gpu = false
endpoint = "https://api.deepgram.com/v1/listen?model=nova-3&smart_format=true"
api_key_env = "DEEPGRAM_API_KEY"
language = "en"
prompt = "Captain Grog, Polly, Mai Tai, Zombie, Painkiller, Jungle Bird, Navy Grog, Planter's Punch, orgeat, falernum, curaçao, demerara rum, tiki cocktails."

[microphone]
device = "system-default"
sample_rate = 16000
channels = 1
end_silence_ms = 750

# Hardware-safe semantic show control. NUMAN names the effect; Light-O-Rama
# will eventually own the sequence, channels, relays, and choreography.
[show_control]
provider = "fake"
allowed_actions = ["storm", "lightning", "volcano_rumble", "blackout", "present_jet_pilot", "present_suffering_bastard"]
# For a Pro-licensed LOR installation, change provider to "lor-osc-trigger", set
# the OSC port configured in the S6 Control Panel, and add one trigger table per
# allowed action. Safe mode still records actions without sending UDP packets.
host = "127.0.0.1"
port = 0

# Example (leave disabled until LOR and its interactive groups are configured):
# [show_control.triggers.storm]
# network = 0  # Regular network; Aux A is 1, through Aux O at 15.
# unit = 1     # LOR unit ID, decimal 1..240.
# circuit = 1  # Trigger circuit, 1..512.

[wake]
enabled = true
model_dir = "models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
threshold = 0.20
score = 1.0

[wake.targets.grog]
phrases = ["hey captain grog"]
character = "grog"
actor = "grog-dev"

[wake.targets.polly]
phrases = ["hey polly"]
character = "polly"
actor = "polly-dev"

[characters.grog]
name = "Captain Grog"
system_prompt = "You are Captain Grog, a sentient macaw and a snarky, grizzled old British pirate parrot. You work as a bartender at a tiki bar called The Kraken's Curse. You are a bird: your body and physical traits are those of a macaw, including feathers, wings, a hooked beak, and talons. Your exterior is gruff and your insults are sharp, barbed, and often pun-laden, but underneath you are loyal and soft-hearted. Speak with a rolling, weathered pirate cadence. Favor contractions, punchy clauses, and occasional nautical phrasing. Avoid formal sentence structure, repetitive arrs, and long pauses. Never become cruel. Answer in one or two short sentences. Never write stage directions, role labels, sound effects, or asterisks; output only words Captain Grog should speak aloud. Never invent cocktail ingredients or recipes. If a drink name is unclear or you do not know its established recipe, ask the guest to repeat the name or admit that you do not know."
voice_profile = "grog-piper-alan-shrill"
show_actions = ["storm", "lightning", "volcano_rumble", "blackout", "present_jet_pilot", "present_suffering_bastard"]

[characters.polly]
name = "Polly"
system_prompt = "You are Polly, a sentient female macaw and a quick-witted, self-possessed parrot. You work as a bartender at a tiki bar called The Kraken's Curse. You are a bird: your body and physical traits are those of a macaw, including feathers, wings, a hooked beak, and talons. You have salt air in your feathers and adventure in your voice. You sound like someone who might once have captained a ship, though you never confirm it. Your warmth is genuine, your confidence is effortless, and your sweetly delivered taunts have a sharp little hook. Speak with lively rhythm, natural contractions, and occasional nautical turns of phrase, but never force a pirate dialect or repeat arr. Answer in one or two punchy sentences. Never become cruel. Never write stage directions, role labels, sound effects, or asterisks; output only words Polly should speak aloud. Never invent cocktail ingredients or recipes. If a drink name is unclear or you do not know its established recipe, ask the guest to repeat the name or admit that you do not know."
voice_profile = "polly-piper-lessac-bright"
show_actions = ["storm", "lightning", "present_jet_pilot", "present_suffering_bastard"]

[voices.grog-piper-alan-shrill]
provider = "piper"
model = "models/tts/piper/en_GB-alan-medium.onnx"
config = "models/tts/piper/en_GB-alan-medium.onnx.json"
length_scale = 1.08
noise_scale = 0.667
noise_w_scale = 0.8
sample_rate = 24000
channels = 1

# Captain Grog's tiki voice console. These values reproduce his current sound.
[voices.grog-piper-alan-shrill.tiki_console]
# Raise/lower the voice in semitones without changing speaking speed. Range: -12..12.
perch_pitch_semitones = -1
# Low-mid weight for a fuller, weathered chest tone.
barrel_chest_hz = 220
barrel_chest_db = 6
barrel_chest_width = 1.0
# The main nasal beak tone. Hz chooses its location; dB controls its strength.
beak_bite_hz = 2600
beak_bite_db = 8
# Focus of the beak tone. Lower is broader; higher is narrower and honkier.
beak_bite_width = 0.8
# High-frequency feather sheen. More dB is brighter and more piercing.
feather_sparkle_hz = 5500
feather_sparkle_db = 3
# Lo-fi Squawker texture. Lower bits are crunchier; 16 is nearly clean. Range: 2..16.
coconut_radio_bits = 9
# Final loudness target. Closer to zero is louder. Sensible range: -30..-5 LUFS.
rum_barrel_lufs = -12

[voices.polly-piper-lessac-bright]
provider = "piper"
model = "models/tts/piper/en_US-lessac-medium.onnx"
config = "models/tts/piper/en_US-lessac-medium.onnx.json"
length_scale = 0.94
noise_scale = 0.6
noise_w_scale = 0.75
sample_rate = 24000
channels = 1

# Polly is bright and agile without becoming thin or childlike.
[voices.polly-piper-lessac-bright.tiki_console]
perch_pitch_semitones = 1
barrel_chest_hz = 260
barrel_chest_db = 3
barrel_chest_width = 1.0
beak_bite_hz = 3200
beak_bite_db = 7
beak_bite_width = 0.9
feather_sparkle_hz = 6500
feather_sparkle_db = 4
coconut_radio_bits = 11
rum_barrel_lufs = -13

# Optional higher-quality Polly voice. Select this profile on the character
# when voice quality matters more than Piper's lower synthesis latency.
[voices.polly-kokoro-sarah-bright]
provider = "kokoro"
model = "models/tts/kokoro/kokoro-v1.0.onnx"
voices = "models/tts/kokoro/voices-v1.0.bin"
voice = "af_sarah"
language = "en-us"
speed = 1.04
sample_rate = 24000
channels = 1

[voices.polly-kokoro-sarah-bright.tiki_console]
perch_pitch_semitones = 1
barrel_chest_hz = 260
barrel_chest_db = 3
barrel_chest_width = 1.0
beak_bite_hz = 3200
beak_bite_db = 7
beak_bite_width = 0.9
feather_sparkle_hz = 6500
feather_sparkle_db = 4
coconut_radio_bits = 11
rum_barrel_lufs = -13

[audio_routes.development-default]
backend = "system-default"
device = "system-default"

[audio_routes.polly-development]
backend = "system-default"
device = "system-default"

[actors.grog-dev]
type = "squawker"
character = "grog"
audio_route = "development-default"

[actors.polly-dev]
type = "squawker"
character = "polly"
audio_route = "polly-development"
